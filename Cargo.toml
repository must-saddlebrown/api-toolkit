[package]
name = "api-toolkit"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[lib]
name = "api_toolkit"
path = "src/lib.rs"

[[bin]]
name = "api-toolkit"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }

[dev-dependencies]
axum = "0.8"
tempfile = "3"
tokio = { version = "1.53", features = ["test-util"] }
